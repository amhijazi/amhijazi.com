name: Deploy Hugo site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.118.2'
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install modules
        run: hugo mod tidy

      - name: Build site
        run: hugo --minify

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/

      - name: Deploy
        uses: actions/deploy-pages@v4
